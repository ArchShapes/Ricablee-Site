<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 // ricablee.pages.dev</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b0f0d;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Subtle CRT scanline overlay */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            z-index: 999;
            background-size: 100% 4px;
            pointer-events: none;
        }

        .error-card {
            background: rgba(15, 23, 18, 0.9);
            border: 1px solid #00ff66;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.15);
            padding: 40px;
            max-width: 500px;
            width: 90%;
            text-align: center;
        }

        .error-code {
            font-size: 4rem;
            font-weight: bold;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(0, 255, 102, 0.4);
        }

        .error-path {
            color: #00bb44;
            font-size: 0.95rem;
            margin-bottom: 25px;
            word-break: break-all;
        }

        .error-message {
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 30px;
            color: #c0ffde;
        }

        .home-btn {
            display: inline-block;
            background: transparent;
            color: #00ff66;
            border: 1px solid #00ff66;
            padding: 12px 25px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
        }

        .home-btn:hover {
            background: #00ff66;
            color: #0b0f0d;
            box-shadow: 0 0 10px #00ff66;
        }

        .cursor {
            display: inline-block;
            width: 10px;
            height: 18px;
            background: #00ff66;
            animation: blink 1s infinite;
            vertical-align: middle;
            margin-left: 5px;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="error-card">
        <div class="error-code">404</div>
        <div class="error-path">&gt; ricablee.pages.dev<span class="cursor"></span></div>
        
        <p class="error-message">
            Page not found. The link you followed may be broken, or the page may have been removed.
        </p>

        <a href="https://ricablee.pages.dev" class="home-btn">&gt; Return Home</a>
    </div>

</body>
</html>
