<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error: Under Construction</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #33ff33;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .terminal {
            background: #000000;
            padding: 30px;
            border: 1px solid #33ff33;
            box-shadow: 0 0 20px rgba(51, 255, 51, 0.2);
            width: 80%;
            max-width: 650px;
            border-radius: 4px;
        }

        .line {
            margin-bottom: 12px;
        }

        .prompt {
            color: #3399ff;
        }

        .error-text {
            color: #ff3333;
            font-weight: bold;
        }

        .cursor {
            display: inline-block;
            width: 9px;
            height: 17px;
            background-color: #33ff33;
            animation: blink 1s steps(2, start) infinite;
            vertical-align: middle;
            margin-left: 4px;
        }

        @keyframes blink {
            to { visibility: hidden; }
        }
    </style>
</head>
<body>

    <div class="terminal">
        <div class="line"><span class="prompt">user@web-server:~$</span> ./index.html</div>
        <div class="line error-text">Error: Under Construction</div>
        <div class="line"><span class="prompt">status:</span> Page deployment pending. Check back later.<span class="cursor"></span></div>
    </div>

</body>
</html>
